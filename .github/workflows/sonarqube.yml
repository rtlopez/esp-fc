name: SonarQube
on:
  push:
    branches:
      - master
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        if: ${{ env.SONAR_TOKEN != '' }}
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis
      - name: Cache SonarQube packages
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar
      - name: Install tools
        if: ${{ env.SONAR_TOKEN != '' }}
        run: |
          pipx install platformio
          pipx install gcovr
      - name: Generate compilation database
        if: ${{ env.SONAR_TOKEN != '' }}
        run: pio run -e coverage -t compiledb
      - name: Run unit tests with coverage
        if: ${{ env.SONAR_TOKEN != '' }}
        run: |
          pio test -e coverage --junit-output-path .pio/junit.xml
          python3 bin/junit_to_sonar.py .pio/junit.xml test-report.xml coverage
          gcovr --root . --filter 'lib/' --exclude 'lib/CmsisDsp/' --exclude 'lib/betaflight/' --sonarqube coverage.xml .pio/build/coverage
      - name: SonarQube Scan
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@59202af334b4ba7b5db01b701b8e79f8b3bef0f4 # v8.5.0
